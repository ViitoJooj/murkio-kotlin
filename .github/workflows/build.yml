name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the library (AAR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Also checks that gradle-wrapper.jar is a genuine Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble the release and its Maven publication
        run: ./gradlew :murkio-identity:assembleRelease :murkio-identity:publishReleasePublicationToMavenLocal

      - name: Check what was built
        run: |
          ls -l murkio-identity/build/outputs/aar/murkio-identity-release.aar
          ls -l ~/.m2/repository/com/murkio/murkio-identity-android/*/
